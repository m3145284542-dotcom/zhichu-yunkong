name: Validate final submission materials

on:
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'docs/**'
      - 'reports/submission/**'
      - 'outputs/submission/**'
      - 'outputs/gui_demo/**'
      - 'outputs/demo_video/**'
      - '.github/workflows/submission.yml'
  pull_request:
    paths:
      - 'README.md'
      - 'docs/**'
      - 'reports/submission/**'
      - 'outputs/submission/**'
      - 'outputs/gui_demo/**'
      - 'outputs/demo_video/**'
      - '.github/workflows/submission.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install PyMuPDF==1.28.2
      - run: python reports/submission/validate_submission.py
