name: Validate final delivery
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt -r requirements-delivery.txt
      - run: python scripts/validate_final_delivery.py
      - run: python scripts/validate_demo_video.py
      - run: python -m unittest discover -s tests -v
